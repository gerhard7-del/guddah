<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Luck, Muffin ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFF7EE;
    --card: #FFFDF9;
    --blush-a: #FFEFE4;
    --blush-b: #FFE1EA;
    --cocoa: #5C3A21;
    --cocoa-soft: #8A6A50;
    --rose: #F0637D;
    --rose-deep: #E14F6C;
    --coral: #FF8FA3;
    --gold: #F5B942;
    --lavender: #C6A2E0;
    --seal: #D98F4E;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100%;
  }

  body{
    font-family: 'Quicksand', sans-serif;
    background: radial-gradient(circle at 20% 15%, var(--blush-a), transparent 55%),
                radial-gradient(circle at 85% 80%, var(--blush-b), transparent 50%),
                var(--cream);
    color: var(--cocoa);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 24px;
  }

  /* ambient floating dots */
  .ambient{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .ambient span{
    position: absolute;
    display: block;
    border-radius: 50%;
    opacity: 0.5;
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift{
    0%, 100%{ transform: translateY(0) translateX(0); }
    50%{ transform: translateY(-22px) translateX(10px); }
  }

  .card{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    padding: 44px 32px 38px;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(92, 58, 33, 0.28), 0 2px 8px rgba(92,58,33,0.06);
    border: 1px solid rgba(240, 99, 125, 0.12);
    min-height: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .muffin-mark{
    width: 54px;
    height: 54px;
    margin-bottom: 6px;
  }

  .stage{
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  .stage.active{
    display: flex;
    animation: fadeInUp 0.6s ease both;
  }

  @keyframes fadeInUp{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  h1.headline{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(30px, 8vw, 40px);
    margin: 0;
    color: var(--rose-deep);
    letter-spacing: 0.2px;
  }

  p.sub{
    font-size: 16px;
    color: var(--cocoa-soft);
    margin: 0;
    line-height: 1.5;
    max-width: 30ch;
  }

  .message-main{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(20px, 6vw, 24px);
    color: var(--rose-deep);
    margin: 4px 0 0;
    line-height: 1.35;
  }

  .message-sub{
    font-size: 16.5px;
    font-weight: 600;
    color: var(--cocoa);
    line-height: 1.6;
    max-width: 28ch;
    margin: 0;
  }
  .message-sub.fade-in{
    animation: fadeInUp 0.5s ease both;
  }

  .punchline{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 6.5vw, 27px);
    color: var(--rose-deep);
    margin: 2px 0 0;
  }

  .final-line{
    font-size: 15.5px;
    font-weight: 600;
    color: var(--cocoa-soft);
    margin: 0;
    letter-spacing: 0.2px;
  }

  button.tap-btn{
    margin-top: 18px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: #fff;
    background: linear-gradient(135deg, var(--coral), var(--rose-deep));
    border: none;
    padding: 14px 30px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 22px -8px rgba(225, 79, 108, 0.55);
    animation: pulse 1.8s ease-in-out infinite;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    white-space: normal;
    max-width: min(80vw, 300px);
    text-align: center;
  }
  button.tap-btn:hover{
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 14px 26px -8px rgba(225, 79, 108, 0.6);
  }
  button.tap-btn:active{
    transform: translateY(0) scale(0.97);
  }

  @keyframes pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.045); }
  }

  /* dodge pop when the button teleports */
  @keyframes dodgePop{
    0%{ transform: scale(0.8) rotate(-5deg); }
    55%{ transform: scale(1.12) rotate(4deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  .dodge-pop{
    animation: dodgePop 0.35s ease !important;
  }

  /* Envelope */
  .envelope-wrap{
    position: relative;
    width: 150px;
    height: 104px;
    margin: 6px auto 4px;
  }
  .envelope{
    position: absolute;
    inset: 0;
    filter: drop-shadow(0 12px 18px rgba(92,58,33,0.18));
  }
  .flap{
    transform-origin: top center;
    transition: transform 0.7s cubic-bezier(.4,1.6,.4,1);
  }
  .envelope-wrap.open .flap{
    transform: rotateX(180deg);
  }
  .seal{
    transition: opacity 0.3s ease 0.15s, transform 0.3s ease 0.15s;
    transform-origin: 75px 52px;
  }
  .envelope-wrap.open .seal{
    opacity: 0;
    transform: scale(0.4);
  }
  .letter{
    opacity: 0;
    transition: opacity 0.4s ease 0.5s, transform 0.5s ease 0.5s;
    transform: translateY(6px);
  }
  .envelope-wrap.open .letter{
    opacity: 1;
    transform: translateY(-10px);
  }

  /* floating hearts/stars burst */
  .burst-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .burst-item{
    position: absolute;
    bottom: 10%;
    font-size: 20px;
    opacity: 0;
    animation: floatUp 2.4s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity: 0; transform: translateY(0) scale(0.6) rotate(0deg); }
    12%{ opacity: 1; }
    100%{ opacity: 0; transform: translateY(-320px) scale(1) rotate(20deg); }
  }

  .hint{
    font-size: 12.5px;
    color: var(--cocoa-soft);
    opacity: 0.65;
    margin-top: 22px;
    letter-spacing: 0.3px;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  @media (max-width: 380px){
    .card{ padding: 36px 22px 30px; min-height: 340px; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<div class="card">

  <!-- Little muffin mark -->
  <svg class="muffin-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M14 30C14 24 19 21 32 21C45 21 50 24 50 30L46 56C46 58.2 44.2 60 42 60H22C19.8 60 18 58.2 18 56L14 30Z" fill="#F0637D"/>
    <path d="M15 30L18 29L21 31L24 29L27 31L30 29L33 31L36 29L39 31L42 29L45 31L49 30" stroke="#E14F6C" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M17 22C17 14 24 8 32 8C40 8 47 14 47 22C47 25 44 27 41 25C39 23.5 38 21 36 22C34 23.5 33 25.5 31 24C29 22.5 28 21 26 22.5C24 24 22 26 19 24C17.5 23 17 22.8 17 22Z" fill="#FBE0C6"/>
    <circle cx="24" cy="16" r="1.6" fill="#F5B942"/>
    <circle cx="34" cy="13" r="1.6" fill="#C6A2E0"/>
    <circle cx="41" cy="18" r="1.6" fill="#F0637D"/>
  </svg>

  <!-- STAGE 1 -->
  <div class="stage active" id="stage1">
    <h1 class="headline">Muffin 👀</h1>
    <p class="sub">cheesy? just follow the instructions yea😂.</p>
    <button class="tap-btn" id="tapOpen">✨ TAP ME ✨</button>
  </div>

  <!-- STAGE 2 (envelope) -->
  <div class="stage" id="stage2">
    <div class="envelope-wrap" id="envelopeWrap">
      <svg class="envelope" viewBox="0 0 150 104" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="14" width="146" height="88" rx="10" fill="#FFEFE4" stroke="#F0637D" stroke-width="1.4"/>
        <path d="M4 16L75 62L146 16" stroke="#F0637D" stroke-width="1.4" fill="none"/>
        <g class="letter">
          <rect x="16" y="30" width="118" height="60" rx="6" fill="#FFFDF9" stroke="#F5B942" stroke-width="1"/>
          <text x="75" y="65" text-anchor="middle" font-size="22">❤️</text>
        </g>
        <g class="flap" style="transform-box: fill-box;">
          <path d="M2 22C2 17.6 5.6 14 10 14H140C144.4 14 148 17.6 148 22L75 66L2 22Z" fill="#FFE1EA" stroke="#F0637D" stroke-width="1.4"/>
        </g>
        <g class="seal">
          <circle cx="75" cy="40" r="13" fill="#D98F4E"/>
          <text x="75" y="46" text-anchor="middle" font-size="16">🧁</text>
        </g>
      </svg>
    </div>
    <p class="sub" id="openingText" style="opacity:0; transition: opacity .4s ease .9s;">Okay okay… </p>
  </div>

  <!-- STAGE 3 -->
  <div class="stage" id="stage3">
    <p class="message-main">All the best in your exams yea❤️</p>
    <p class="message-sub" id="dontRushText" style="display:none;">Don't rush it, just relax. You've got this.</p>
    <button class="tap-btn" id="tapMore1">Tap for more 😌</button>
    <button class="tap-btn" id="tapMore2" style="display:none;">Tap for more 😌</button>
  </div>

  <!-- STAGE 4 -->
  <div class="stage" id="stage4">
    <p class="punchline">Your head wai 😂</p>
    <p class="final-line">Go make us proud, and im here for you.</p>
    <p class="hint">— gerhard</p>
  </div>

</div>

<div class="burst-layer" id="burstLayer"></div>

<script>
  const stage1 = document.getElementById('stage1');
  const stage2 = document.getElementById('stage2');
  const stage3 = document.getElementById('stage3');
  const stage4 = document.getElementById('stage4');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const openingText = document.getElementById('openingText');
  const burstLayer = document.getElementById('burstLayer');
  const ambient = document.getElementById('ambient');
  const tapOpen = document.getElementById('tapOpen');
  const tapMore1 = document.getElementById('tapMore1');
  const tapMore2 = document.getElementById('tapMore2');
  const dontRushText = document.getElementById('dontRushText');

  const emojis = ['💛','✨','💗','⭐','🧡'];

  function burst(count){
    for(let i = 0; i < count; i++){
      setTimeout(() => {
        const el = document.createElement('span');
        el.className = 'burst-item';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = (10 + Math.random() * 80) + '%';
        el.style.fontSize = (16 + Math.random() * 14) + 'px';
        el.style.animationDuration = (2 + Math.random() * 1.2) + 's';
        burstLayer.appendChild(el);
        setTimeout(() => el.remove(), 3600);
      }, i * 90);
    }
  }

  function ambientDots(){
    const colors = ['#F0637D', '#F5B942', '#C6A2E0', '#FF8FA3'];
    for(let i = 0; i < 16; i++){
      const s = document.createElement('span');
      const size = 4 + Math.random() * 6;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      s.style.animationDelay = (Math.random() * 6) + 's';
      s.style.animationDuration = (10 + Math.random() * 8) + 's';
      ambient.appendChild(s);
    }
  }
  ambientDots();

  // ---- playful "dodge" button behavior ----
  // moves the button to a random spot on screen for each entry in dodgeTexts,
  // then fires onComplete on the following click.
  function dodgeButton(button){
  const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const w = button.offsetWidth;
  const h = button.offsetHeight;
  const padding = 28;
  const maxX = Math.max(vw - w - padding * 2, 0);
  const maxY = Math.max(vh - h - padding * 2, 0);
  const x = padding + Math.random() * maxX;
  const y = padding + Math.random() * maxY;
  button.style.position = 'fixed';
  button.style.left = x + 'px';
  button.style.top = y + 'px';
  button.style.margin = '0';
  button.style.zIndex = '30';
  button.classList.remove('dodge-pop');
  void button.offsetWidth;
  button.classList.add('dodge-pop');
}

function makeDodgy(button, dodgeTexts, onComplete){
  let clicks = 0;
  function handleClick(){
    clicks++;
    if(clicks <= dodgeTexts.length){
      button.textContent = dodgeTexts[clicks - 1]; // set text BEFORE measuring, so sizing is accurate
      dodgeButton(button);
    } else {
      button.removeEventListener('click', handleClick);
      onComplete();
    }
  }
  button.addEventListener('click', handleClick);
}
  // Stage 1 -> envelope -> stage 3, but she has to "catch" the button once first
  makeDodgy(tapOpen, ["😅 oops, you missed — try again"], () => {
    stage1.classList.remove('active');
    stage2.classList.add('active');
    burst(10);

    setTimeout(() => {
      envelopeWrap.classList.add('open');
    }, 150);

    setTimeout(() => {
      openingText.style.opacity = 1;
    }, 900);

    setTimeout(() => {
      stage2.classList.remove('active');
      stage3.classList.add('active');
    }, 2600);
  });

  // First "tap for more" is straightforward: reveals the "don't rush" line
  // and swaps in the second, dodgier "tap for more" button.
  tapMore1.addEventListener('click', () => {
    tapMore1.style.display = 'none';
    dontRushText.style.display = 'block';
    dontRushText.classList.add('fade-in');
    tapMore2.style.display = 'inline-block';
  });

  // Second "tap for more" dodges twice before letting the punchline through.
  makeDodgy(tapMore2, ["😏 ah ah, try again", "😂 so close… try again"], () => {
    stage3.classList.remove('active');
    stage4.classList.add('active');
    burst(14);
  });
</script>

</body>
</html>
